<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de datos</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

        </div>

          </div >
              <div>

                <option value="Trasporte">Trasporte</option>

                <option value="Servicio">Servicios</option>

               </select>

              </div>
                <div>
                    <button type="button" id="agragarGasto">

                 </div>
    </div>
    <div class="titleTodosGastos">Todos los Gastos</div>
    <div id="todos">
        <ul class="listaTodosGastos" id="listaTodosGastos">

        </ul>

    </div>

    <div class="gastosDeHoy" id="gastosDeHoy">
        
    

    </div>

     <div class="gastosDeLMes" id="gastosDeLMes">
    

    </div>
    <div class="gastosCategoria">
            <ul id="listaGastosCategoria">

            </ul>
    </div>
    <div class="gastosTotal">

    </div>
    

    <script src="script.js"></script>
</body>
</html>
